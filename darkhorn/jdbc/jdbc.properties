# darkhorn-jdbc connection properties
# Used by the IVIG UAS JDBC adapter

# JDBC URL
jdbc.url=jdbc:postgresql://localhost:5432/darkhorn_jdbc
jdbc.driver=org.postgresql.Driver

# Credentials
jdbc.username=darkhorn
jdbc.password=Sp3ct3r0fN1ght!

# Connection pool
jdbc.pool.minIdle=1
jdbc.pool.maxTotal=10
jdbc.pool.maxWaitMillis=5000

# Tables
jdbc.table.users=users
jdbc.table.groups=groups
jdbc.table.userGroups=user_groups

# Column mappings — users table
jdbc.col.users.id=id
jdbc.col.users.username=username
jdbc.col.users.email=email
jdbc.col.users.firstName=first_name
jdbc.col.users.lastName=last_name
jdbc.col.users.password=password
jdbc.col.users.status=status
jdbc.col.users.department=department
jdbc.col.users.title=title
jdbc.col.users.createdAt=created_at
jdbc.col.users.updatedAt=updated_at

# Column mappings — groups table
jdbc.col.groups.id=id
jdbc.col.groups.name=name
jdbc.col.groups.description=description

# Column mappings — user_groups table
jdbc.col.userGroups.userId=user_id
jdbc.col.userGroups.groupId=group_id
