services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: darkhorn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:          ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD:      ${POSTGRES_PASSWORD:-postgresadmin}
      POSTGRES_DB:            postgres
      DARKHORN_DB_PASSWORD:   ${DARKHORN_DB_PASSWORD:-darkhorn}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-db.sh:/docker-entrypoint-initdb.d/00-init-db.sh
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "${JDBC_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Seed (runs once, then exits) ─────────────────────────────────────────────
  seed:
    build:
      context: ./db
      dockerfile: Dockerfile.seed
    container_name: darkhorn-seed
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST:     postgres
      PGPORT:     5432
      PGUSER:     darkhorn
      PGPASSWORD: ${DARKHORN_DB_PASSWORD:-darkhorn}
    restart: "no"

  # ── darkhorn-rest ────────────────────────────────────────────────────────────
  darkhorn-rest:
    build:
      context: ./rest
    container_name: darkhorn-rest
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      PGHOST:     postgres
      PGPORT:     5432
      PGDATABASE: darkhorn_rest
      PGUSER:     darkhorn
      PGPASSWORD: ${DARKHORN_DB_PASSWORD:-darkhorn}
    ports:
      - "${REST_PORT:-3000}:3000"
    volumes:
      - rest_keystore:/app/data
      - ./rest/config.json:/app/config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── darkhorn-sftp seed (runs once, then exits) ───────────────────────────────
  sftp-seed:
    build:
      context: ./sftp
      dockerfile: Dockerfile.seed
    container_name: darkhorn-sftp-seed
    environment:
      DATA_DIR: /data
    volumes:
      - sftp_data:/data
    restart: "no"

  # ── darkhorn-sftp ─────────────────────────────────────────────────────────────
  darkhorn-sftp:
    image: atmoz/sftp:latest
    container_name: darkhorn-sftp
    restart: unless-stopped
    depends_on:
      sftp-seed:
        condition: service_completed_successfully
    environment:
      SFTP_USERS: ${SFTP_USER:-spectral}:${SFTP_PASS:-Sp3ctr4lF1l3!}:1001
    volumes:
      - sftp_data:/home/${SFTP_USER:-spectral}/darkhorn
    ports:
      - "${SFTP_PORT:-2222}:22"

  # ── darkhorn-soap ─────────────────────────────────────────────────────────────
  darkhorn-soap:
    build:
      context: ./soap
    container_name: darkhorn-soap
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      PORT:       3002
      PGHOST:     postgres
      PGPORT:     5432
      PGDATABASE: darkhorn_soap
      PGUSER:     darkhorn
      PGPASSWORD: ${DARKHORN_DB_PASSWORD:-darkhorn}
      SOAP_USER:  ${SOAP_USER:-banshee}
      SOAP_PASS:  ${SOAP_PASS:-B4nsh33Sc4ms!}
    ports:
      - "${SOAP_PORT:-3002}:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ ──────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: darkhorn-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${MQ_USER:-darkhorn}
      RABBITMQ_DEFAULT_PASS: ${MQ_PASS:-Wr41thPuls3!}
    ports:
      - "${MQ_AMQP_PORT:-5672}:5672"
      - "${MQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── darkhorn-mq worker ────────────────────────────────────────────────────────
  darkhorn-mq:
    build:
      context: ./mq
    container_name: darkhorn-mq
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      MQ_URL:     amqp://${MQ_USER:-darkhorn}:${MQ_PASS:-Wr41thPuls3!}@rabbitmq:5672
      MQ_QUEUE:   darkhorn.requests
      MQ_API_KEY: ${MQ_API_KEY:-}
      PGHOST:     postgres
      PGPORT:     5432
      PGDATABASE: darkhorn_mq
      PGUSER:     darkhorn
      PGPASSWORD: ${DARKHORN_DB_PASSWORD:-darkhorn}

  # ── OpenLDAP ──────────────────────────────────────────────────────────────────
  darkhorn-ldap:
    image: osixia/openldap:1.5.0
    container_name: darkhorn-ldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION:        "Darkhorn"
      LDAP_DOMAIN:              "darkhorn.local"
      LDAP_ADMIN_PASSWORD:      ${LDAP_ADMIN_PASS:-Bl4ckTr33Admin!}
      LDAP_READONLY_USER:       "true"
      LDAP_READONLY_USER_USERNAME: ${LDAP_SVC_USER:-svc-darkhorn}
      LDAP_READONLY_USER_PASSWORD: ${LDAP_SVC_PASS:-Sp3ctr3Qu13t!}
      LDAP_TLS:                 "false"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./ldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom
    ports:
      - "${LDAP_PORT:-389}:389"
    command: --loglevel warning

volumes:
  postgres_data:
  rest_keystore:
  sftp_data:
  rabbitmq_data:
  ldap_data:
  ldap_config:
